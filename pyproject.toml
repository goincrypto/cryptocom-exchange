[tool.poetry]
authors = ["Morty Space <morty.space@gmail.com>"]
description = "Python 3.11+ async library for crypto.com/exchange API using httpx and websockets"
license = "MIT"
name = "cryptocom-exchange"
packages = [
  {include = "cryptocom", from = "src"},
]
exclude = ["openapi_docs/"]
version = "2.8.0"
readme = "README.md"
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.poetry.dependencies]
aiolimiter = "^1.2.1"
async-timeout = "^5.0.1"
httpx = "^0.28.1"
python = "^3.11"
typing-extensions = "^4.0.0"
websockets = "^15.0.1"

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
line-length = 88
target-version = "py311"
unsafe-fixes = true

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=1.0.0"]

[tool.semantic_release]
version_toml = [
  "pyproject.toml:tool.poetry.version",
]
branch = "main"
# Release types are declared ONCE, in the v9+ table at the end of this section.
# The flat `parser_angular_*` keys that used to sit here (and promised that
# `test`/`refactor`/`sync` were patch types) are pre-v9 naming: the release job
# installs python-semantic-release UNPINNED (10.7.0 today) and 10.x ignores
# unknown keys without a word of warning. Dead config since 2022-05-15
# (bd155b9); measured 2026-10-18, a `test:`-only push (2f0a41c) computed no
# version while those lines promised a patch.
# `changelog_sections` below is pre-v9 naming too, and inert: CHANGELOG.md has
# not been regenerated since v2.2.0 and the published notes come from
# `gh release create --generate-notes`. Not a live setting - do not trust it.
changelog_sections="feature,fix,sync,perf,breaking,documentation,performance,:boom:,:sparkles:,:children_crossing:,:lipstick:,:iphone:,:egg:,:chart_with_upwards_trend:,:ambulance:,:lock:,:bug:,:zap:,:goal_net:,:alien:,:wheelchair:,:speech_balloon:,:mag:,:apple:,:penguin:,:checkered_flag:,:robot:,:green_apple:,Other"

# The live knob (v9+ naming), and unlike the keys it replaces it FAILS LOUDLY on
# a wrong shape: these are lists, a comma-joined string is a hard validation
# error. Measured against 10.7.0 with `semantic-release --noop version`, a push
# to main bumps: `feat:` -> minor, `fix:`/`perf:` -> patch, `!` or a BREAKING
# CHANGE footer -> major. Everything in `other_allowed_tags` is recognised and
# publishes NOTHING on its own - including `sync:` (the pair-bot's regenerated
# instruments ride the next fix/feat, and 10.x lists them in no changelog
# section because they never bump). See AGENTS.md > Releases.
[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
other_allowed_tags = [
  "build",
  "chore",
  "ci",
  "docs",
  "style",
  "refactor",
  "test",
  "sync",
]

[dependency-groups]
dev = [
    "ruff>=0.15.20,<0.16.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.1.0,<2.0.0",
    "pytest-cov>=6.2.1,<7.0.0",
    "pytest-doctestplus>=1.4.0,<2.0.0",
    "pre-commit>=4.3.0,<5.0.0",
    "Sphinx>=8.2.3,<9.0.0",
    "sphinx-rtd-theme>=3.0.2,<4.0.0",
    "mypy>=1.17.1,<2.0.0",
    "importlib-metadata>=8.7.0,<9.0.0",
]
