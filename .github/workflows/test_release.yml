---
name: Test & Release
on:
  schedule:
    - cron: "0 14 * * 6,0"
  push:
    branches:
      - main
      - production
      - feature/*
      - fix/*
  pull_request:
    branches:
      - main
      - production
jobs:
  test:
    strategy:
      max-parallel: 4
      matrix:
        python-version: ['3.14', '3.13', '3.12', '3.11']
    runs-on: ubuntu-latest
    steps:
      - name: Download code
        uses: actions/checkout@v3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download cache for pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: py-${{ matrix.python-version }}-poetry-pip-1.2.2
          restore-keys: poetry-pip
      - name: Install poetry
        run: pip install poetry==2.4.1
      # NOTE: do not cache ./.venv - a bare restore-keys prefix used to
      # resurrect a stale python-3.11 venv under the 3.14 matrix leg
      # (coverage/behavior silently diverged from the declared runtime).
      - name: Install packages
        run: poetry install
      - name: Verify pytest installation
        run: poetry run pytest --version
      - name: Download cache for pre-commit
        if: matrix.python-version == '3.14'
        id: pre-commit-install
        uses: actions/cache@v3
        with:
          path: ~/.cache/pre-commit
          key: py-${{ matrix.python-version }}-pre-commit-install-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-install
      - name: Verify commit
        if: matrix.python-version == '3.14'
        run: poetry run pre-commit run -a
      - name: Auto-generate missing pairs
        if: matrix.python-version == '3.14'
        run: poetry run python generate.py
      - name: Format code before pushing
        if: matrix.python-version == '3.14'
        run: poetry run pre-commit run -a
        continue-on-error: true
      - name: Commit & Push changes
        if: matrix.python-version == '3.14' && github.ref == 'refs/heads/main'
        uses: actions-js/push@v1.3
        with:
          author_email: "pair-bot@users.noreply.github.com"
          author_name: "pair-bot"
          directory: './src'
          message: "sync: updated API pairs and instruments"
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test code
        timeout-minutes: 6
        # --cov names the package, not ".": with a poetry venv inside the
        # workspace, "--cov ." drags executed site-packages code into the
        # denominator and the number varies with runner layout.
        # Gate runs only on the canonical (newest) runtime: pre-3.14
        # interpreters skip version-gated branches and measure lower.
        run: poetry run pytest -v --cov=cryptocom.exchange --cov-report xml:coverage.xml ${{ matrix.python-version == '3.14' && '--cov-fail-under=90' || '' }}
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.REPOSITORY_PASSWORD }}
        run: |
          git fetch --tags --force
          git reset --hard origin/main
          pip install python-semantic-release poetry twine
          git config user.name github-actions
          git config user.email github-actions@github.com
          before=$(git describe --tags --abbrev=0)
          semantic-release version
          after=$(git describe --tags --abbrev=0)
          if [ "$after" = "$before" ]; then
            echo "No new version computed - nothing to release"
            exit 0
          fi
          # Push the version commit + tag BEFORE publishing: the tags on
          # origin are the single source of truth, so a retried or crashed
          # run can never recompute a version PyPI already has.
          # Header auth keeps the token out of .git/config and remote URLs.
          git -c http.extraHeader="Authorization: Bearer ${GH_TOKEN}" push origin HEAD:main --follow-tags
          # --skip-existing makes republish retries idempotent.
          poetry build
          twine upload --skip-existing dist/*
          gh release view "$after" >/dev/null 2>&1 || gh release create "$after" --generate-notes
